<!DOCTYPE html>
<html>
<head>
  <title>Ultimate Todo App</title>

  <style>
    body { font-family: Arial; background:#f5f5f5; padding:20px; }

    input { padding:8px; margin:5px; }

    button { padding:6px 10px; margin:3px; cursor:pointer; }

    ul { padding:0; }

    li {
      list-style:none;
      padding:10px;
      margin:5px 0;
      background:white;
      border:1px solid #ccc;
      display:flex;
      justify-content:space-between;
      align-items:center;
      touch-action: pan-y;
    }

    li:hover { outline:2px solid #007bff; }

    .completed { text-decoration:line-through; color:gray; }

    .left { display:flex; align-items:center; gap:8px; }

    h2 { margin-top:20px; }
  </style>

</head>
<body>

<h2 id="categoryTitle">Category: General</h2>

<input type="text" id="categoryInput" placeholder="Enter category">
<button id="setCategory">Set Category</button>

<br>

<input type="text" id="task" placeholder="Enter task">
<button id="add">Add</button>
<button id="saveDraft">Save Draft</button>
<button id="showDraft">Show Draft</button>
<button id="newPage">New Todo Page</button>

<ul id="list"></ul>

<script>
let list = document.getElementById("list");
let draggedItem = null;
let STORAGE_KEY = "tasks_" + Date.now(); // unique per page

// Category
document.getElementById("setCategory").addEventListener("click", () => {
  let cat = document.getElementById("categoryInput").value;
  if (cat) {
    document.getElementById("categoryTitle").textContent = "Category: " + cat;
  }
});

// Add task
document.getElementById("add").addEventListener("click", () => {
  let text = document.getElementById("task").value.trim();
  if (text) {
    createTask(text);
    document.getElementById("task").value = "";
  }
});

// Save draft
document.getElementById("saveDraft").addEventListener("click", () => {
  let tasks = [];
  document.querySelectorAll("#list li span").forEach(span => {
    tasks.push(span.textContent);
  });
  localStorage.setItem("draftTasks", JSON.stringify(tasks));
  alert("Draft saved!");
});

// Show draft
document.getElementById("showDraft").addEventListener("click", () => {
  let win = window.open("", "_blank");

  win.document.write(`
    <html>
    <body style="font-family:Arial;padding:20px;">
    <h3>Draft Tasks</h3>
    <button onclick="goBack()">⬅ Back</button>
    <ul id="draftList"></ul>

    <script>
      let drafts = JSON.parse(localStorage.getItem("draftTasks"))||[];
      let list = document.getElementById("draftList");

      function goBack(){ window.opener.focus(); window.close(); }

      function render(){
        list.innerHTML="";
        drafts.forEach((t,i)=>{
          let li=document.createElement("li");

          let input=document.createElement("input");
          input.value=t;
          input.onchange=()=>{
            drafts[i]=input.value;
            localStorage.setItem("draftTasks",JSON.stringify(drafts));
          };

          let del=document.createElement("button");
          del.textContent="Delete";
          del.onclick=()=>{
            drafts.splice(i,1);
            localStorage.setItem("draftTasks",JSON.stringify(drafts));
            render();
          };

          let add=document.createElement("button");
          add.textContent="Add";
          add.onclick=()=>window.opener.createTask(input.value);

          li.append(input,del,add);
          list.appendChild(li);
        });
      }

      render();
    <\/script>
    </body>
    </html>
  `);
});

// New page (FULL clone)
document.getElementById("newPage").addEventListener("click", () => {
  let win = window.open("", "_blank");
  win.document.write(document.documentElement.outerHTML);
});

// Create task
function createTask(text) {
  let li = document.createElement("li");

  let left = document.createElement("div");
  left.className = "left";

  let checkbox = document.createElement("input");
  checkbox.type = "checkbox";

  let span = document.createElement("span");
  span.textContent = text;

  checkbox.onchange = () => span.classList.toggle("completed", checkbox.checked);

  // Edit
  let edit = document.createElement("button");
  edit.textContent = "Edit";

  edit.onclick = () => {
    let input = document.createElement("input");
    input.value = span.textContent;
    li.replaceChild(input, left);
    input.focus();

    input.onblur = () => {
      span.textContent = input.value;
      left.innerHTML="";
      left.append(checkbox,span);
      li.insertBefore(left,li.firstChild);
      li.removeChild(input);
    };
  };

  // Move
  let up = document.createElement("button");
  up.textContent = "↑";
  up.onclick = () => li.previousElementSibling && list.insertBefore(li, li.previousElementSibling);

  let down = document.createElement("button");
  down.textContent = "↓";
  down.onclick = () => li.nextElementSibling && list.insertBefore(li.nextElementSibling, li);

  let actions = document.createElement("div");
  actions.append(up, down, edit);

  left.append(checkbox, span);
  li.append(left, actions);

  // Swipe delete
  let startX=0;
  li.addEventListener("touchstart",e=>startX=e.touches[0].clientX);
  li.addEventListener("touchend",e=>{
    let diff=e.changedTouches[0].clientX-startX;
    if(Math.abs(diff)>100) li.remove();
  });

  // Drag
  li.draggable=true;
  li.addEventListener("dragstart",()=>draggedItem=li);
  list.addEventListener("dragover",e=>{
    e.preventDefault();
    let after=[...list.children].find(c=>{
      let b=c.getBoundingClientRect();
      return e.clientY < b.top+b.height/2;
    });
    after?list.insertBefore(draggedItem,after):list.appendChild(draggedItem);
  });

  list.appendChild(li);
}
</script>

</body>
</html>
